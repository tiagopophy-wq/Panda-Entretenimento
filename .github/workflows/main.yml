name: Build Panda Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Panda/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p Panda assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Panda-Entretenimento-APK
          path: Panda/app/build/outputs/apk/debug/*.apk
